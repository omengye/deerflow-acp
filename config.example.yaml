# Shared outbound proxy; Settings > Common applies this to model and web requests.
network:
  proxy:
    enabled: false
    url: ''
    no_proxy: [localhost, 127.0.0.1, '::1']

# Eino Go harness configuration. Model keys are resolved from the environment.
# Commands, OpenCLI, subagents and paid skill generation require explicit opt-in.
config_version: eino-harness-v1

local_acp:
  # Optional: /goal objectives work without auto-continuation. When enabled,
  # at most 3 native continuations share the original budget and permissions.
  # goal_auto_continue: true
  # Maximum size per output artifact in MiB; positive integer, restart required.
  max_artifact_size_mib: 500
  # max_iterations: 0 disables. Model/tool calls: 0 selects the long-task safety
  # checkpoint (4000 model / 12000 tool calls per task, sized for 3-hour tasks);
  # the user continues with another message. Set a larger value to raise it.
  max_iterations: 0
  max_model_calls: 0
  max_tool_calls: 0
  # Optional cumulative task spending limit; 0 leaves long tasks unrestricted.
  max_run_tokens: 0
  # One output budget, including reasoning. Independent of the provider wire field.
  max_output_tokens: 4096
  model_name: null
  max_active_connections: 16
  max_active_runs: 2
  # No default task/queue wall-clock limit; individual calls remain bounded.
  queue_timeout_seconds: 0
  run_timeout_seconds: 0
  permission_mode: dangerous
  memory_scope: workspace
  enable_bash: false
  tool_allowlist: null
  tool_denylist: []
  accept_client_mcp_servers: false
  client_mcp_allowed_commands: []
  # Detached session retention for standalone ACP installations.
  session_cleanup_enabled: true
  inactive_session_retention_days: 30
  closed_session_retention_days: 30
  session_cleanup_interval_seconds: 3600

# Legacy iLink settings, imported once into the channel store. New installations
# use Settings > Channels or channel.* management; never put bot tokens in YAML.
# See docs/channel-plugins.md. New channels inherit global tool permissions.
wechat:
  enabled: false
  workspace: ""
  allowed_users: []
  approval: read_only

models:
  - name: qwen3.6-plus
  # Opt in only after verifying this model's endpoint supports both on and off.
  # thinking_parameter: enable_thinking
  # Other contracts: thinking_type, reasoning_effort (none to disable), claude.
  # unsupported declares no switching; omitted means capability is unknown.
  # reasoning_effort requires an explicit session effort before thinking=on.
  # thinking_budget_tokens: 1024 # Claude only; must be below max_output_tokens.
    display_name: Qwen 3.6 Plus
    provider: openai
    model: qwen3.6-plus
    # Or keep the key in DeerFlow's secret vault: api_key: ${secret:DASHSCOPE_API_KEY}
    api_key: ${DASHSCOPE_API_KEY:-not-configured}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # auto: Tencent Copilot and Claude use max_tokens; other chat routes use
    # max_completion_tokens. Override for gateways that require the older field.
    output_token_parameter: auto
    supports_vision: false
    # Opt in to the Responses image_generation tool; not a capability probe.
    # The endpoint/model must support the tool. Independent of image input.
    supports_image_generation: false
    context_window: 262144

default_model: qwen3.6-plus

subagents:
  enabled: false
  max_concurrent: 2
  # Native roles inherit parent limits; 0 adds no role time limit.
  timeout_seconds: 0
  max_turns: null
  agents: {}
  custom_agents: {}

sandbox:
  provider: local
  allow_host_bash: false
  allow_host_tools: false

# Host-owned connections are configured separately from client MCP permissions.
# Empty by default. Recipes and credentials stay in this host file; restart to apply.
mcp:
  host_recipes: []

skills:
  enabled: true
  path: ./skills
  extensions_file: ./extensions_config.json

summarization:
  # Trigger automatically follows the selected model's configured context_window.
  enabled: true
  keep: {type: messages, value: 8}

memory:
  enabled: true
  mode: middleware
  injection_enabled: true
  retrieval_enabled: true
  # Additional single_user worker cap; does not replace root-budget accounting.
  # 0 pauses new automatic calls; already saved extraction results can replay.
  daily_attempts: 200
  # Independent embedding indexing (when embedding_url/model are configured).
  index_max_attempts: 3
  index_retry_seconds: 60
  index_max_retry_seconds: 3600

search:
  default_provider: auto
  fetch_provider: local
  providers:
    brave:
      api_key: ${BRAVE_API_KEY:-}
    deepseek:
      api_key: ${DEEPSEEK_API_KEY:-}
    searxng:
      base_url: ${SEARXNG_BASE_URL:-}
      api_key: ${SEARXNG_API_KEY:-${SEARXNG_TOKEN:-}}

# Native tool settings; tool_allowlist/tool_denylist control access.
tools:
  - name: web_search
    max_results: 5
  - name: web_fetch
    timeout: 10
  - name: image_search
    max_results: 5
  - name: ls
  - name: read_file
  - name: glob
    max_results: 200
  - name: grep
    max_results: 100
  - name: write_file
  - name: str_replace
  - name: move_path
  - name: delete_path
  # This tool also requires sandbox.allow_host_tools=true and an installed CLI.
  - name: host_opencli
    executable: opencli
    timeout: 120
    allowed_sites: [web, twitter, xiaohongshu, xiaoyuzhou, weixin, douyin, bilibili]
  - name: bash

# Shared outbound proxy; Settings > Common applies this to model and web requests.
network:
  proxy:
    enabled: false
    url: ''
    no_proxy: [localhost, 127.0.0.1, '::1']

# Eino Go harness configuration. Model keys are resolved from the environment.
# Commands, OpenCLI, subagents and paid skill generation require explicit opt-in.
config_version: eino-harness-v1

local_acp:
  # max_iterations: 0 disables. Model/tool calls: 0 selects the long-task safety
  # checkpoint (4000 model / 12000 tool calls per task, sized for 3-hour tasks);
  # the user continues with another message. Set a larger value to raise it.
  max_iterations: 0
  max_model_calls: 0
  max_tool_calls: 0
  # Optional cumulative task spending limit; 0 leaves long tasks unrestricted.
  max_run_tokens: 0
  # Total output per request, including reasoning. Field selection is per route.
  max_output_tokens: 4096
  model_name: null
  max_active_connections: 16
  max_active_runs: 2
  # No default task/queue wall-clock limit; individual calls remain bounded.
  queue_timeout_seconds: 0
  run_timeout_seconds: 0
  permission_mode: dangerous
  memory_scope: workspace
  enable_bash: false
  tool_allowlist: null
  tool_denylist: []
  accept_client_mcp_servers: false
  client_mcp_allowed_commands: []
  # Detached session retention for standalone ACP installations.
  session_cleanup_enabled: true
  inactive_session_retention_days: 30
  closed_session_retention_days: 30
  session_cleanup_interval_seconds: 3600

models:
  - name: openai
    display_name: OpenAI
    provider: openai
    model: gpt-4.1-mini
    api_key: ${OPENAI_API_KEY:-not-configured}
    base_url: https://api.openai.com/v1
    supports_vision: true

default_model: openai

subagents:
  enabled: false
  max_concurrent: 2
  # Native roles inherit parent limits; 0 adds no role time limit.
  timeout_seconds: 0
  max_turns: null
  agents: {}
  custom_agents: {}

sandbox:
  provider: local
  allow_host_bash: false
  allow_host_tools: false

# Host-owned connections are configured separately from client MCP permissions.
# Empty by default. Recipes and credentials stay in this host file; restart to apply.
mcp:
  host_recipes: []

skills:
  enabled: true
  path: ../skills
  extensions_file: ./extensions_config.json

summarization:
  # Trigger automatically follows the selected model's configured context_window.
  enabled: true
  keep: {type: messages, value: 8}

memory:
  enabled: true
  include_global: true
  mode: middleware
  injection_enabled: true
  retrieval_enabled: true

search:
  default_provider: auto
  fetch_provider: local
  providers:
    brave:
      api_key: ${BRAVE_API_KEY:-}
    deepseek:
      api_key: ${DEEPSEEK_API_KEY:-}
    searxng:
      base_url: ${SEARXNG_BASE_URL:-}
      api_key: ${SEARXNG_API_KEY:-${SEARXNG_TOKEN:-}}

# Native tool settings; tool_allowlist/tool_denylist control access.
tools:
  - name: web_search
    max_results: 5
  - name: web_fetch
    timeout: 10
  - name: image_search
    max_results: 5
  - name: ls
  - name: read_file
  - name: glob
    max_results: 200
  - name: grep
    max_results: 100
  - name: write_file
  - name: str_replace
  - name: move_path
  - name: delete_path
  # This tool also requires sandbox.allow_host_tools=true and an installed CLI.
  - name: host_opencli
    executable: opencli
    timeout: 120
    allowed_sites: [web, twitter, xiaohongshu, xiaoyuzhou, weixin, douyin, bilibili]
  - name: bash

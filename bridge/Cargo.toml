[package]
name = "deerflow-acp-bridge"
version = "0.1.0"
edition = "2024"
description = "Native stdio bridge for the long-lived local DeerFlow ACP daemon"
license = "MIT"

[[bin]]
name = "deerflow-acp"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=2.0.0", features = ["unstable_protocol_v2"] }
agent-client-protocol-http = { version = "2.0.0", features = ["client", "server"] }
axum = "0.8"
futures = "0.3.32"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

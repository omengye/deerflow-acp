name: Build Windows Desktop

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build and test Windows x64 desktop
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      # GPUI compiles a large Rust dependency tree.
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Check out repository and version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configure MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check native build tools
        run: |
          foreach ($tool in @('cl.exe', 'link.exe', 'rc.exe', 'cmake.exe')) {
            Get-Command $tool -ErrorAction Stop | Select-Object Name, Source
          }
          $fxc = Get-Command fxc.exe -ErrorAction SilentlyContinue
          if ($fxc) {
            $fxcPath = $fxc.Source
          } else {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $fxcPath = Get-ChildItem -Path "$sdkBin\*\x64\fxc.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $fxcPath) { throw 'Windows SDK shader compiler fxc.exe is required for GPUI release builds' }
          "GPUI_FXC_PATH=$fxcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows-x64-${{ hashFiles('desktop-app/.cargo/config.toml', 'scripts/cargo-windows-static-crt.toml') }}
          # Target paths are relative to each Cargo workspace, not the repo root.
          workspaces: |
            desktop-app -> ../.build-cache/desktop-build
            bridge -> target

      - name: Set up Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: go-harness/go.sum

      - name: Build Eino Go desktop and corresponding source
        timeout-minutes: 120
        run: |
          ./scripts/build-deerflow-desktop-go.ps1 -Configuration Release `
            -OutputDirectory 'dist/desktop/DeerFlow-Desktop-Go' `
            -DesktopTargetDirectory '.build-cache/desktop-build' -CreateZip

      - name: Test packaged Waku and Go harness with local fake models
        id: smoke
        timeout-minutes: 30
        run: |
          Push-Location go-harness
          try {
            go build -o ../.build-cache/deerflow-desktop-smoke.exe ./cmd/deerflow-desktop-smoke
            if ($LASTEXITCODE -ne 0) { throw 'Go smoke build failed' }
          } finally { Pop-Location }
          & ./.build-cache/deerflow-desktop-smoke.exe --package ./dist/desktop/DeerFlow-Desktop-Go
          if ($LASTEXITCODE -ne 0) { throw 'Desktop protocol smoke failed' }
          & ./.build-cache/deerflow-desktop-smoke.exe --package ./dist/desktop/DeerFlow-Desktop-Go --legacy-empty-mcp-policy
          if ($LASTEXITCODE -ne 0) { throw 'Legacy MCP policy smoke failed' }
      - name: Calculate SHA-256 checksums
        run: |
          foreach ($name in @('DeerFlow-Desktop-Go-windows-x64.zip', 'DeerFlow-Desktop-Go-source.zip')) {
            $archive = Join-Path 'dist\desktop' $name
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          }

      - name: Upload desktop and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: DeerFlow-Desktop-windows-x64
          path: |
            dist/desktop/DeerFlow-Desktop-*.zip
            dist/desktop/DeerFlow-Desktop-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload smoke test diagnostics
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: DeerFlow-Desktop-smoke-logs
          path: .build-cache/desktop-smoke/*/logs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Attach desktop package to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: DeerFlow-Desktop-windows-x64
          path: dist/desktop

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            dist/desktop/DeerFlow-Desktop-*.zip
            dist/desktop/DeerFlow-Desktop-*.zip.sha256

name: Release Windows Portable ACP

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    with:
      package: ACP
  publish:
    name: Attach verified ACP package to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeerFlow-Windows-ACP-x64
          path: dist/windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256

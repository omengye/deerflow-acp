name: Native Buzz adapter

on:
  pull_request:
    paths: ['integrations/buzz/**', 'bridge/**', 'go-harness/**', '.github/workflows/buzz.yml']
  push:
    paths: ['integrations/buzz/**', 'bridge/**', 'go-harness/**', '.github/workflows/buzz.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: integrations/buzz
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            integrations/buzz/go.sum
            go-harness/go.sum
      - run: go mod verify
      - run: go test -count=1 -timeout=3m ./...
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=5m ./...
      - name: Build Rust Bridge
        working-directory: bridge
        run: cargo build --locked
      - name: Build Go daemon
        working-directory: go-harness
        run: go build -o ../bridge/target/debug/deerflow-acpd${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/deerflow-acpd-go
      - name: Verify Buzz against native ACP
        env:
          DEERFLOW_TEST_BRIDGE: ${{ github.workspace }}/bridge/target/debug/deerflow-acp${{ runner.os == 'Windows' && '.exe' || '' }}
          DEERFLOW_TEST_GO_DAEMON: ${{ github.workspace }}/bridge/target/debug/deerflow-acpd${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -count=1 -run TestNativeReleaseBuzzIntegration -v -timeout=2m ./internal/adapter
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "${{ github.workspace }}/dist/buzz/windows-x64-ci" -DesktopRoot "${{ github.workspace }}/bridge/target/debug"
      - name: Build Linux executable
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../dist/buzz/linux-x64
          go build -trimpath -ldflags '-s -w -X main.version=0.3.0' -o ../../dist/buzz/linux-x64/buzz-deerflow-adapter ./cmd/buzz-deerflow-adapter
          ../../dist/buzz/linux-x64/buzz-deerflow-adapter --version
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-go-${{ runner.os }}-x64
          path: dist/buzz/
          if-no-files-found: error

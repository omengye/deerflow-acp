name: Desktop contracts

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Waku and build contracts on Windows
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: go-harness/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app -> target
      - name: Check Waku desktop and daemon
        working-directory: desktop-app
        run: cargo check --locked -p waku --bin waku -p waku-daemon --bin waku-daemon -p waku-core
      - name: Test Waku DeerFlow contracts
        working-directory: desktop-app
        run: cargo test --locked -p waku -p waku-core --lib deerflow
      - name: Test source archive identity guard
        run: ./scripts/test-desktop-source-identity.ps1
      - name: Validate build entry points
        run: ./scripts/test-go-build-entrypoints.ps1
      - name: Test Windows package release gates
        run: ./scripts/test-windows-package.ps1

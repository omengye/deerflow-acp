[project]
name = "deerflow-api"
dynamic = ["version"]
description = "API service wrapper for DeerFlow agent harness"
requires-python = ">=3.12"
dependencies = [
    # API service
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.1.0",
    # Auth classification imports Starlette's router path projection directly;
    # keep upgrades visible because this is a security boundary.
    "starlette>=1.3.1,<2",
    "python-multipart>=0.0.26",
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    # DeerFlow harness (embedded)
    "agent-client-protocol>=0.10,<0.11",
    "agent-sandbox>=0.0.19",
    "dotenv>=0.9.9",
    "httpx[socks]>=0.28.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=1.3.4",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.9,<1.3",
    "langgraph-api>=0.10.0",
    "langgraph-cli>=0.4.30",
    "langgraph-runtime-inmem>=0.30.0",
    "langgraph-checkpoint>=4.2.0,<5.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "langgraph-sdk>=0.4.2",
    "langfuse>=3.4.1",
    "markdownify>=1.2.2",
    "tiktoken>=0.8.0",
    "langchain-google-genai>=4.2.1",
    "langchain-deepseek>=1.0.1",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "scrapling>=0.4.0",
    "curl-cffi>=0.7.0",
    "json-repair>=0.30.0",
    # IANA timezone database for Windows and minimal container images.
    "tzdata>=2025.2",
]

[project.scripts]
deerflow-acp = "deerflow.acp.__main__:main"
deerflow-acpd = "deerflow.acp.daemon:main"

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.3.0"]
pymupdf = ["pymupdf4llm>=0.0.17"]
sandbox-docker = ["kubernetes>=30.0.0"]
file-convert = ["markitdown>=0.1.0"]
feishu = ["lark-oapi>=1.3.0"]
qiniu = ["qiniu"]
rustfs = ["boto3>=1.35.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app", "deerflow", "packages/deerflow_sdk"]

[tool.hatch.build.targets.wheel.sources]
"packages/deerflow_sdk" = "deerflow_sdk"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

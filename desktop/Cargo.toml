[package]
name = "deerflow-config"
version = "0.1.0"
edition = "2024"
description = "Portable DeerFlow ACP configuration and daemon controller"
license = "MIT"
build = "build.rs"

[[bin]]
name = "deerflow-config"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "svg", "advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1.31"
